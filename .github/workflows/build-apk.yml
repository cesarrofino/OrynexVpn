name: Compilar Orynex VPN Android

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versao (ex.: 1.1). Vazio = a do app/build.gradle.kts"
        required: false
        default: ""
      publicar:
        description: "Publicar o APK numa Release (v<versao>)"
        type: boolean
        required: false
        default: false
  release:
    types: [published]
  push:
    paths:
      - "OrynexVpn.zip"
      - "*.zip"
      - "build-apk.yml"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: orynex-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extrair ZIP e compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Obter ficheiros do repositorio
        uses: actions/checkout@v4

      - name: Verificar ZIP do projeto
        id: project_zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="OrynexVpn.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::O ficheiro OrynexVpn.zip nao foi encontrado na raiz do repositorio."
            echo "Ficheiros ZIP encontrados:"
            find . -maxdepth 2 -type f -iname '*.zip' -print || true
            exit 1
          fi

          if ! unzip -tq "$ZIP_FILE" >/dev/null; then
            echo "::error::OrynexVpn.zip esta danificado ou nao e um ZIP valido."
            exit 1
          fi

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "ZIP valido: $ZIP_FILE"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataformas e ferramentas Android
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extrair e localizar o projeto dentro de OrynexVpn.zip
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q -o "OrynexVpn.zip" -d extracted_project

          SETTINGS_FILE="$(find extracted_project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Nao encontrei settings.gradle.kts nem settings.gradle dentro de OrynexVpn.zip."
            echo "Conteudo extraido:"
            find extracted_project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::O projeto foi localizado, mas app/build.gradle(.kts) nao existe em $PROJECT_DIR."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado em: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Definir versao do aplicativo
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSAO: ${{ github.event.inputs.versao }}
        run: |
          set -euo pipefail
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"

          VERSION=""
          if [ -n "${RELEASE_TAG:-}" ]; then
            VERSION="${RELEASE_TAG#[vV]}"
          elif [ -n "${INPUT_VERSAO:-}" ]; then
            VERSION="${INPUT_VERSAO#[vV]}"
          elif [ -f "$GRADLE_FILE" ]; then
            VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$GRADLE_FILE" | head -n 1)"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::warning::Versao vazia ou invalida; sera usada 1.0."
            VERSION="1.0"
          fi

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "::error::Nao encontrei $GRADLE_FILE."
            exit 1
          fi

          sed -i -E "s/versionName[[:space:]]*=[[:space:]]*\"[^\"]*\"/versionName = \"$VERSION\"/" "$GRADLE_FILE"
          sed -i -E "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = ${GITHUB_RUN_NUMBER}/" "$GRADLE_FILE"

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Versao definida: $VERSION"
          grep -nE "versionName|versionCode" "$GRADLE_FILE" || true

      - name: Compilar APK com os motores configurados no projeto
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "Compilando OrynexVPN com OpenVPN habilitado (configuracao padrao do ZIP)..."
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/orynex-build.log"

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::A compilacao terminou sem produzir APK debug."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/Orynex-debug.apk"

      - name: Compilar APK release
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/orynex-release.log"

          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -n "$APK" ]; then
            cp "$APK" "$GITHUB_WORKSPACE/dist/Orynex.apk"
          else
            echo "::warning::Nao foi encontrado APK release; o APK debug continuara disponivel."
          fi

      - name: Disponibilizar APK em Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Orynex-APK-${{ env.APP_VERSION }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK numa Release
        if: github.event_name == 'release' || github.event.inputs.publicar == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-v$APP_VERSION}"
          APK_TO_PUBLISH="dist/Orynex.apk"

          if [ ! -f "$APK_TO_PUBLISH" ]; then
            APK_TO_PUBLISH="dist/Orynex-debug.apk"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_TO_PUBLISH" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK_TO_PUBLISH" --repo "$GITHUB_REPOSITORY" \
              --title "Orynex $APP_VERSION" \
              --notes "Compilacao automatica do OrynexVPN $APP_VERSION."
          fi

          echo "APK publicado na Release $TAG"

      - name: Mostrar diagnostico se a compilacao falhar
        if: failure()
        shell: bash
        run: |
          echo "Verifique os erros acima. O workflow extrai OrynexVpn.zip e compila o projeto encontrado dentro dele."
          if [ -f "$RUNNER_TEMP/orynex-build.log" ]; then
            echo "===== RESUMO DOS ERROS ====="
            grep -E "What went wrong|Could not resolve|Could not find|Unresolved reference|^e: |FAILURE:" -A4 "$RUNNER_TEMP/orynex-build.log" | tail -100 || true
          fi
          if [ -f "$RUNNER_TEMP/orynex-release.log" ]; then
            echo "===== ERROS RELEASE ====="
            grep -E "What went wrong|Could not resolve|Could not find|Unresolved reference|^e: |FAILURE:" -A4 "$RUNNER_TEMP/orynex-release.log" | tail -100 || true
          fi
